_ > nanoagent.plugin.v0001.ProductConfig:
tagline: "Book the lowest logical coach fare under the AT&T Vendor Expense Policy"
summary: "Describe a trip in plain words, including the flight you would normally take, and an agent books a one-way flight for a vendor of a telecommunications company, as of today, under an air-travel policy based on the AT&T Vendor Expense Policy: the lowest logical coach fare within two hours of your original flight and with at most one extra stop, refundable or not, never first class, and business only on an 8-hour flight with your manager's approval. Real airports and airline names; simulated fares and schedules. A deterministic verifier checks every booking against the policy's rules."
highlights:
  - "Say when you would like to leave and whether you want a nonstop: the plugin finds your original flight and the cheaper logical alternatives"
  - "The verdict lists each policy rule with what was expected and what was booked"
  - "Real airports and airlines flying several times a day, with simulated fares, so the same request on the same day always gets the same offers and verdict"
steps:
  - "Ask what information is needed to book a flight"
  - "Describe your trip: traveller, airports, travel date, preferred departure time, nonstop or connecting, and whether business class is wanted and approved"
  - "Read the booking and the verifier's checks on the result card"
